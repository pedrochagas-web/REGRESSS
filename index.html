<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A MAIOR TRIP DE TODAS ⚡</title>
  
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Space+Grotesk:wght@400;700;900&family=Bungee&display=swap" rel="stylesheet">
  
  <!-- Canvas Confetti & Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: #050508;
      color: #fff;
      overflow-x: hidden;
    }
    
    .font-marker {
      font-family: 'Permanent Marker', cursive;
    }
    
    .font-bungee {
      font-family: 'Bungee', cursive;
    }

    /* Glitch Text Effect */
    .glitch-text {
      position: relative;
      text-shadow: 2px 2px 0px #ff0055, -2px -2px 0px #00ffff;
      animation: glitch 1.5s infinite alternate;
    }
    
    @keyframes glitch {
      0% { text-shadow: 2px 2px 0px #ff0055, -2px -2px 0px #00ffff; transform: skew(0deg); }
      20% { text-shadow: -2px -2px 0px #ff0055, 2px 2px 0px #00ffff; transform: skew(-1deg); }
      40% { text-shadow: 3px -1px 0px #ff0055, -3px 1px 0px #00ffff; transform: skew(1deg); }
      60% { text-shadow: -1px 2px 0px #ff0055, 1px -2px 0px #00ffff; transform: skew(0deg); }
      100% { text-shadow: 2px 2px 0px #ff0055, -2px -2px 0px #00ffff; transform: skew(-0.5deg); }
    }

    /* Chaos Card Borders & Glow */
    .neon-border {
      border: 3px solid #ff0055;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.6), inset 0 0 15px rgba(255, 0, 85, 0.3);
    }
    
    .neon-box-blue {
      border: 2px solid #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4), inset 0 0 8px rgba(0, 240, 255, 0.2);
    }

    /* Photo Ratio for Mobile */
    .mobile-photo-frame {
      aspect-ratio: 4 / 5;
      width: 100%;
      position: relative;
      overflow: hidden;
      border-radius: 1.5rem;
    }

    /* Noise Background Overlay */
    .noise-bg {
      background-image: radial-gradient(rgba(255, 0, 85, 0.15) 1px, transparent 0), radial-gradient(rgba(0, 240, 255, 0.15) 1px, transparent 0);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
    }
  </style>
</head>
<body class="min-h-screen noise-bg flex justify-center selection:bg-pink-600 selection:text-white">

  <!-- Mobile Container (Max width de celular para ficar perfeito no WhatsApp/Instagram) -->
  <main class="w-full max-w-md min-h-screen flex flex-col justify-between p-4 pb-12 relative z-10">

    <!-- Top Badge / Header -->
    <header class="text-center pt-2 pb-1">
      <div class="inline-flex items-center gap-2 bg-yellow-400 text-black font-bungee text-xs px-3 py-1 rounded-full uppercase tracking-wider transform -rotate-2 shadow-lg shadow-yellow-500/30">
        <span>⚠️ NÍVEL DE LOUCURA: MÁXIMO</span>
      </div>
      <h1 id="tripTitle" class="text-3xl font-bungee glitch-text tracking-wide mt-3 text-white uppercase leading-tight">
        PARTIU TRIP COM OS CRIA 🚀
      </h1>
      <p id="tripSubtitle" class="text-sm text-zinc-400 font-bold mt-1 tracking-wider uppercase">
        O fígado chora, a história fica!
      </p>
    </header>

    <!-- CARROSSEL VERTICAL (ESTILO INSTAGRAM/REELS COM SWIPE) -->
    <section class="my-3">
      <div class="mobile-photo-frame neon-border bg-zinc-950 shadow-2xl relative select-none">
        
        <!-- Story Bars (Indicadores no Topo) -->
        <div id="storyBars" class="absolute top-3 inset-x-3 z-30 flex gap-1.5 pointer-events-none"></div>

        <!-- Tag Flutuante na Foto -->
        <div class="absolute bottom-4 left-4 z-30 bg-black/80 backdrop-blur-md px-3 py-1.5 rounded-lg border border-pink-500/40">
          <p id="photoCaption" class="text-xs font-bungee text-pink-400">🔥 FOTO DOS GUERREIROS</p>
        </div>

        <!-- Fotos -->
        <div id="photoContainer" class="w-full h-full relative cursor-grab active:cursor-grabbing">
          <!-- As imagens são injetadas via JavaScript -->
        </div>

        <!-- Controles de Toque / Setas discretas -->
        <button id="prevBtn" class="absolute left-2 top-1/2 -translate-y-1/2 z-20 w-9 h-9 rounded-full bg-black/70 border border-white/20 flex items-center justify-center text-white active:scale-90 transition">
          <i data-lucide="chevron-left" class="w-5 h-5"></i>
        </button>
        <button id="nextBtn" class="absolute right-2 top-1/2 -translate-y-1/2 z-20 w-9 h-9 rounded-full bg-black/70 border border-white/20 flex items-center justify-center text-white active:scale-90 transition">
          <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>
      </div>
    </section>

    <!-- CONTAGEM REGRESSIVA NO ESTILO CAOS / DIGITAL -->
    <section class="space-y-2">
      <div class="text-center">
        <span class="text-[11px] font-bungee text-cyan-400 tracking-widest uppercase">TEMPO RESTANTE ATÉ O DESASTRE</span>
      </div>

      <div class="grid grid-cols-4 gap-2">
        <!-- Dias -->
        <div class="neon-box-blue bg-zinc-900/90 rounded-2xl p-2.5 text-center flex flex-col justify-center items-center backdrop-blur-md">
          <span id="days" class="text-3xl font-bungee text-white">00</span>
          <span class="text-[10px] font-bold uppercase text-zinc-400 mt-0.5">DIAS</span>
        </div>
        <!-- Horas -->
        <div class="neon-box-blue bg-zinc-900/90 rounded-2xl p-2.5 text-center flex flex-col justify-center items-center backdrop-blur-md">
          <span id="hours" class="text-3xl font-bungee text-pink-400">00</span>
          <span class="text-[10px] font-bold uppercase text-zinc-400 mt-0.5">HORAS</span>
        </div>
        <!-- Minutos -->
        <div class="neon-box-blue bg-zinc-900/90 rounded-2xl p-2.5 text-center flex flex-col justify-center items-center backdrop-blur-md">
          <span id="minutes" class="text-3xl font-bungee text-yellow-400">00</span>
          <span class="text-[10px] font-bold uppercase text-zinc-400 mt-0.5">MINS</span>
        </div>
        <!-- Segundos -->
        <div class="neon-box-blue bg-zinc-900/90 rounded-2xl p-2.5 text-center flex flex-col justify-center items-center backdrop-blur-md border-pink-500 shadow-pink-500/30">
          <span id="seconds" class="text-3xl font-bungee text-cyan-300 animate-pulse">00</span>
          <span class="text-[10px] font-bold uppercase text-zinc-400 mt-0.5">SEGS</span>
        </div>
      </div>
    </section>

    <!-- BARRA INFERIOR DE BOTÕES E INTERAÇÃO -->
    <footer class="mt-4 flex items-center justify-between gap-3">
      <!-- Botão de Hype / Buzina -->
      <button id="hypeBtn" class="flex-1 py-3 px-4 rounded-xl font-bungee text-sm bg-gradient-to-r from-pink-600 to-yellow-500 text-white shadow-lg shadow-pink-500/30 active:scale-95 transition flex items-center justify-center gap-2">
        <i data-lucide="party-popper" class="w-5 h-5"></i>
        <span>SOLTAR O HYPE!</span>
      </button>

      <!-- Botão Som / Batida -->
      <button id="soundBtn" class="w-12 h-12 rounded-xl bg-zinc-800 border border-white/20 flex items-center justify-center text-zinc-300 active:scale-90 transition">
        <i data-lucide="volume-2" id="soundIcon" class="w-5 h-5"></i>
      </button>

      <!-- Botão Configurações -->
      <button id="openConfigBtn" class="w-12 h-12 rounded-xl bg-zinc-800 border border-white/20 flex items-center justify-center text-zinc-300 active:scale-90 transition">
        <i data-lucide="settings-2" class="w-5 h-5"></i>
      </button>
    </footer>

  </main>

  <!-- MODAL / DRAWER DE CONFIGURAÇÕES -->
  <div id="configModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-end sm:items-center justify-center hidden">
    <div class="bg-zinc-900 border-t sm:border border-pink-500/40 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 text-white max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bungee text-pink-400">CONFIGURAR A TRIP</h2>
        <button id="closeConfigBtn" class="text-zinc-400 hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
      </div>

      <div class="space-y-4 text-xs font-bold uppercase">
        <div>
          <label class="block text-zinc-400 mb-1">Título do Evento</label>
          <input type="text" id="inputTitle" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-white font-sans text-sm focus:border-pink-500 outline-none">
        </div>

        <div>
          <label class="block text-zinc-400 mb-1">Subtítulo / Frase Marcante</label>
          <input type="text" id="inputSubtitle" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-white font-sans text-sm focus:border-pink-500 outline-none">
        </div>

        <div>
          <label class="block text-zinc-400 mb-1">Data & Hora do Embarque / Festa</label>
          <input type="datetime-local" id="inputDate" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-white font-sans text-sm focus:border-pink-500 outline-none">
        </div>

        <div>
          <label class="block text-zinc-400 mb-1">Adicionar Fotos da Galeria</label>
          <input type="file" id="inputFile" accept="image/*" multiple class="w-full text-zinc-400 file:mr-3 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-xs file:font-bungee file:bg-pink-600 file:text-white cursor-pointer bg-zinc-800 p-1 rounded-lg">
        </div>

        <button id="saveConfigBtn" class="w-full py-3 rounded-xl bg-cyan-400 text-black font-bungee text-sm mt-4 hover:bg-cyan-300 transition shadow-lg shadow-cyan-500/30">
          SALVAR MUDANÇAS
        </button>
      </div>
    </div>
  </div>

  <script>
    // Lucide Icons init
    lucide.createIcons();

    // Estado da Aplicação
    const state = {
      title: localStorage.getItem('trip_title') || "PARTIU TRIP COM OS CRIA 🚀",
      subtitle: localStorage.getItem('trip_subtitle') || "O FÍGADO CHORA, A HISTÓRIA FICA!",
      targetDate: localStorage.getItem('trip_date') || new Date(Date.now() + 10 * 24 * 60 * 60 * 1000).toISOString().slice(0, 16),
      photos: JSON.parse(localStorage.getItem('trip_photos')) || [
        { url: "https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?q=80&w=1000&auto=format&fit=crop", caption: "SE NÃO FOR PRA DAR PT NEM VOU" },
        { url: "https://images.unsplash.com/photo-1492684223066-81342ee5ff30?q=80&w=1000&auto=format&fit=crop", caption: "OS SOBREVIVENTES DA MADRUGADA" },
        { url: "https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?q=80&w=1000&auto=format&fit=crop", caption: "PREPARA O ENGOV E VAI" }
      ],
      currentIndex: 0,
      soundActive: false
    };

    // Elementos DOM
    const photoContainer = document.getElementById('photoContainer');
    const storyBars = document.getElementById('storyBars');
    const photoCaption = document.getElementById('photoCaption');
    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const tripTitle = document.getElementById('tripTitle');
    const tripSubtitle = document.getElementById('tripSubtitle');

    // Inicializar Títulos
    function renderTitles() {
      tripTitle.innerText = state.title;
      tripSubtitle.innerText = state.subtitle;
    }
    renderTitles();

    // Renderizar Fotos & Indicadores
    function renderCarousel() {
      photoContainer.innerHTML = '';
      storyBars.innerHTML = '';

      state.photos.forEach((photo, index) => {
        // Imagem
        const img = document.createElement('img');
        img.src = photo.url;
        img.className = `absolute inset-0 w-full h-full object-cover transition-opacity duration-300 ${index === state.currentIndex ? 'opacity-100' : 'opacity-0 pointer-events-none'}`;
        photoContainer.appendChild(img);

        // Barra de progresso estilo story
        const bar = document.createElement('div');
        bar.className = `h-1 flex-1 rounded-full transition-all duration-300 ${index === state.currentIndex ? 'bg-pink-500 shadow-sm shadow-pink-500' : 'bg-white/30'}`;
        storyBars.appendChild(bar);
      });

      photoCaption.innerText = state.photos[state.currentIndex]?.caption || "VIBE TOTAL 🔥";
    }
    renderCarousel();

    function goToIndex(idx) {
      if (idx < 0) idx = state.photos.length - 1;
      if (idx >= state.photos.length) idx = 0;
      state.currentIndex = idx;
      renderCarousel();
    }

    document.getElementById('prevBtn').addEventListener('click', () => goToIndex(state.currentIndex - 1));
    document.getElementById('nextBtn').addEventListener('click', () => goToIndex(state.currentIndex + 1));

    // Suporte a Swipe no Celular
    let touchStartX = 0;
    photoContainer.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    photoContainer.addEventListener('touchend', e => {
      const touchEndX = e.changedTouches[0].clientX;
      if (touchStartX - touchEndX > 40) goToIndex(state.currentIndex + 1);
      if (touchEndX - touchStartX > 40) goToIndex(state.currentIndex - 1);
    }, { passive: true });

    // Contagem Regressiva
    function updateCountdown() {
      const now = new Date().getTime();
      const target = new Date(state.targetDate).getTime();
      const distance = target - now;

      if (distance <= 0) {
        daysEl.innerText = "00";
        hoursEl.innerText = "00";
        minutesEl.innerText = "00";
        secondsEl.innerText = "00";
        return;
      }

      const d = Math.floor(distance / (1000 * 60 * 60 * 24));
      const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((distance % (1000 * 60)) / 1000);

      daysEl.innerText = String(d).padStart(2, '0');
      hoursEl.innerText = String(h).padStart(2, '0');
      minutesEl.innerText = String(m).padStart(2, '0');
      secondsEl.innerText = String(s).padStart(2, '0');
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();

    // Efeito de Confetes / Hype
    document.getElementById('hypeBtn').addEventListener('click', () => {
      confetti({
        particleCount: 80,
        spread: 70,
        origin: { y: 0.8 },
        colors: ['#ff0055', '#00f0ff', '#facc15', '#ffffff']
      });
      playBeep();
    });

    // Sons Sintetizados via Web Audio API (Não precisa de arquivo externo)
    let audioCtx = null;
    function playBeep() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    // Modal de Configuração
    const configModal = document.getElementById('configModal');
    document.getElementById('openConfigBtn').addEventListener('click', () => {
      document.getElementById('inputTitle').value = state.title;
      document.getElementById('inputSubtitle').value = state.subtitle;
      document.getElementById('inputDate').value = state.targetDate;
      configModal.classList.remove('hidden');
    });

    document.getElementById('closeConfigBtn').addEventListener('click', () => {
      configModal.classList.add('hidden');
    });

    // Salvar Configurações
    document.getElementById('saveConfigBtn').addEventListener('click', () => {
      state.title = document.getElementById('inputTitle').value;
      state.subtitle = document.getElementById('inputSubtitle').value;
      state.targetDate = document.getElementById('inputDate').value;

      localStorage.setItem('trip_title', state.title);
      localStorage.setItem('trip_subtitle', state.subtitle);
      localStorage.setItem('trip_date', state.targetDate);

      const files = document.getElementById('inputFile').files;
      if (files.length > 0) {
        state.photos = [];
        Array.from(files).forEach((file, index) => {
          const reader = new FileReader();
          reader.onload = e => {
            state.photos.push({ url: e.target.result, caption: `VIBE #${index + 1}` });
            if (state.photos.length === files.length) {
              localStorage.setItem('trip_photos', JSON.stringify(state.photos));
              renderCarousel();
            }
          };
          reader.readAsDataURL(file);
        });
      }

      renderTitles();
      configModal.classList.add('hidden');
    });
  </script>
</body>
</html>
